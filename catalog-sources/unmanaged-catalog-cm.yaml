"DeepSeek-R1-Distill-Llama-8B"}],"labels":["inference","deepseek","fp8","vllm"],"tasks":["text-generation"],"createTimeSinceEpoch":1738368000,"lastUpdateTimeSinceEpoch":1740528000,"artifacts":[{"protocol":"NOT YET IN REGISTRY","createTimeSinceEpoch":null,"tags":null,"uri":"https://huggingface.co/neuralmagic/DeepSeek-R1-Distill-Llama-8B-FP8-dynamic/commits/main"}]},{"repository":"neuralmagic","name":"Qwen2.5-VL-72B-Instruct-quantized.w8a8","provider":"Neural Magic","description":"Quantized version of Qwen/Qwen2.5-VL-72B-Instruct.","longDescription":"This model was obtained by quantizing the weights of Qwen/Qwen2.5-VL-72B-Instruct to INT8 data type,  \n  ready for inference with vLLM >= 0.5.2.","readme":"# Qwen2.5-VL-72B-Instruct-quantized-w8a8\n\n## Model Overview\n- **Model Architecture:** Qwen/Qwen2.5-VL-72B-Instruct\n  - **Input:** Vision-Text\n  - **Output:** Text\n- **Model Optimizations:**\n  - **Weight quantization:** INT8\n  - **Activation quantization:** INT8\n- **Release Date:** 2/24/2025\n- **Version:** 1.0\n- **Model Developers:** Neural Magic\n\nQuantized version of [Qwen/Qwen2.5-VL-72B-Instruct](https://huggingface.co/Qwen/Qwen2.5-VL-72B-Instruct).\n\n### Model Optimizations\n\nThis model was obtained by quantizing the weights of [Qwen/Qwen2.5-VL-72B-Instruct](https://huggingface.co/Qwen/Qwen2.5-VL-72B-Instruct) to INT8 data type, ready for inference with vLLM >= 0.5.2.\n\n## Deployment\n\n### Use with vLLM\n\nThis model can be deployed efficiently using the [vLLM](https://docs.vllm.ai/en/latest/) backend, as shown in the example below.\n\n```python\nfrom vllm.assets.image import ImageAsset\nfrom vllm import LLM, SamplingParams\n# prepare model\nllm = LLM(\n    model=\"neuralmagic/Qwen2.5-VL-72B-Instruct-quantized.w8a8\",\n    trust_remote_code=True,\n    max_model_len=4096,\n    max_num_seqs=2,\n)\n# prepare inputs\nquestion = \"What is the content of this image?\"\ninputs = {\n    \"prompt\": f\"<|user|>\\n<|image_1|>\\n{question}<|end|>\\n<|assistant|>\\n\",\n    \"multi_modal_data\": {\n        \"image\": ImageAsset(\"cherry_blossom\").pil_image.convert(\"RGB\")\n    },\n}\n# generate response\nprint(\"========== SAMPLE GENERATION ==============\")\noutputs = llm.generate(inputs, SamplingParams(temperature=0.2, max_tokens=64))\nprint(f\"PROMPT  : {outputs[0].prompt}\")\nprint(f\"RESPONSE: {outputs[0].outputs[0].text}\")\nprint(\"==========================================\")\n```\n\nvLLM also supports OpenAI-compatible serving. See the [documentation](https://docs.vllm.ai/en/latest/) for more details.\n\n## Creation\n\nThis model was created with [llm-compressor](https://github.com/vllm-project/llm-compressor) by running the code snippet below as part a multimodal announcement blog.\n\n<details>\n  <summary>Model Creation Code</summary>\n  \n```python\nimport base64\nfrom io import BytesIO\nimport torch\nfrom datasets import load_dataset\nfrom qwen_vl_utils import process_vision_info\nfrom transformers import AutoProcessor\nfrom llmcompressor.modifiers.quantization import GPTQModifier\nfrom llmcompressor.transformers import oneshot\nfrom llmcompressor.transformers.tracing import (\n    TraceableQwen2_5_VLForConditionalGeneration,\n)\n# Load model.\nmodel_id = \"Qwen/Qwen2.5-VL-72B-Instruct\"\nmodel = TraceableQwen2_5_VLForConditionalGeneration.from_pretrained(\n    model_id,\n    device_map=\"auto\",\n    torch_dtype=\"auto\",\n)\nprocessor = AutoProcessor.from_pretrained(model_id, trust_remote_code=True)\n# Oneshot arguments\nDATASET_ID = \"lmms-lab/flickr30k\"\nDATASET_SPLIT = {\"calibration\": \"test[:512]\"}\nNUM_CALIBRATION_SAMPLES = 512\nMAX_SEQUENCE_LENGTH = 2048\n# Load dataset and preprocess.\nds = load_dataset(DATASET_ID, split=DATASET_SPLIT)\nds = ds.shuffle(seed=42)\ndampening_frac=0.01\n# Apply chat template and tokenize inputs.\ndef preprocess_and_tokenize(example):\n    # preprocess\n    buffered = BytesIO()\n    example[\"image\"].save(buffered, format=\"PNG\")\n    encoded_image = base64.b64encode(buffered.getvalue())\n    encoded_image_text = encoded_image.decode(\"utf-8\")\n    base64_qwen = f\"data:image;base64,{encoded_image_text}\"\n    messages = [\n        {\n            \"role\": \"user\",\n            \"content\": [\n                {\"type\": \"image\", \"image\": base64_qwen},\n                {\"type\": \"text\", \"text\": \"What does the image show?\"},\n            ],\n        }\n    ]\n    text = processor.apply_chat_template(\n        messages, tokenize=False, add_generation_prompt=True\n    )\n    image_inputs, video_inputs = process_vision_info(messages)\n    # tokenize\n    return processor(\n        text=[text],\n        images=image_inputs,\n        videos=video_inputs,\n        padding=False,\n        max_length=MAX_SEQUENCE_LENGTH,\n        truncation=True,\n    )\nds = ds.map(preprocess_and_tokenize, remove_columns=ds[\"calibration\"].column_names)\n# Define a oneshot data collator for multimodal inputs.\ndef data_collator(batch):\n    assert len(batch) == 1\n    return {key: torch.tensor(value) for key, value in batch[0].items()}\n# Recipe\nrecipe = [\n    GPTQModifier(\n        targets=\"Linear\",\n        scheme=\"W8A8\",\n        sequential_targets=[\"Qwen2_5_VLDecoderLayer\"],\n        ignore=[\"lm_head\", \"re:visual.*\"],\n    ),\n]\nSAVE_DIR==f\"{model_id.split('/')[1]}-quantized.w8a8\"\n# Perform oneshot\noneshot(\n    model=model,\n    tokenizer=model_id,\n    dataset=ds,\n    recipe=recipe,\n    max_seq_length=MAX_SEQUENCE_LENGTH,\n    num_calibration_samples=NUM_CALIBRATION_SAMPLES,\n    trust_remote_code_model=True,\n    data_collator=data_collator,\n    output_dir=SAVE_DIR\n)\n```\n</details>\n\n## Evaluation\n\nThe model was evaluated using [mistral-evals](https://github.com/neuralmagic/mistral-evals) for vision-related tasks and using [lm_evaluation_harness](https://github.com/neuralmagic/lm-evaluation-harness) for select text-based benchmarks. The evaluations were conducted using the following commands:\n\n<details>\n<summary>Evaluation Commands</summary>\n  \n### Vision Tasks\n- vqav2\n- docvqa\n- mathvista\n- mmmu\n- chartqa\n\n```\nvllm serve neuralmagic/pixtral-12b-quantized.w8a8 --tensor_parallel_size 1 --max_model_len 25000 --trust_remote_code --max_num_seqs 8 --gpu_memory_utilization 0.9 --dtype float16 --limit_mm_per_prompt image=7\npython -m eval.run eval_vllm \\\n        --model_name neuralmagic/pixtral-12b-quantized.w8a8 \\\n        --url http://0.0.0.0:8000 \\\n        --output_dir ~/tmp \\\n        --eval_name <vision_task_name>\n```\n\n### Text-based Tasks\n#### MMLU\n  \n```\nlm_eval \\\n  --model vllm \\\n  --model_args pretrained=\"<model_name>\",dtype=auto,add_bos_token=True,max_model_len=4096,tensor_parallel_size=<n>,gpu_memory_utilization=0.8,enable_chunked_prefill=True,trust_remote_code=True \\\n  --tasks mmlu \\\n  --num_fewshot 5 \\\n  --batch_size auto \\\n  --output_path output_dir\n```\n\n#### MGSM\n\n```\nlm_eval \\\n  --model vllm \\\n  --model_args pretrained=\"<model_name>\",dtype=auto,max_model_len=4096,max_gen_toks=2048,max_num_seqs=128,tensor_parallel_size=<n>,gpu_memory_utilization=0.9 \\\n  --tasks mgsm_cot_native \\\n  --num_fewshot 0 \\\n  --batch_size auto \\\n  --output_path output_dir\n```\n</details>\n\n\n### Accuracy\n\n<table>\n  <thead>\n    <tr>\n      <th>Category</th>\n      <th>Metric</th>\n      <th>Qwen/Qwen2.5-VL-72B-Instruct</th>\n      <th>neuralmagic/Qwen2.5-VL-72B-Instruct-quantized.w8a8</th>\n      <th>Recovery (%)</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td rowspan=\"6\"><b>Vision</b></td>\n      <td>MMMU (val, CoT)<br><i>explicit_prompt_relaxed_correctness</i></td>\n      <td>64.33</td>\n      <td>67.56</td>\n      <td>105.02%</td>\n    </tr>\n    <tr>\n      <td>VQAv2 (val)<br><i>vqa_match</i></td>\n      <td>81.94</td>\n      <td>81.91</td>\n      <td>99.96%</td>\n    </tr>\n    <tr>\n      <td>DocVQA (val)<br><i>anls</i></td>\n      <td>94.71</td>\n      <td>94.71</td>\n      <td>100.00%</td>\n    </tr>\n    <tr>\n      <td>ChartQA (test, CoT)<br><i>anywhere_in_answer_relaxed_correctness</i></td>\n      <td>88.96</td>\n      <td>89.40</td>\n      <td>100.49%</td>\n    </tr>\n    <tr>\n      <td>Mathvista (testmini, CoT)<br><i>explicit_prompt_relaxed_correctness</i></td>\n      <td>78.18</td>\n      <td>78.38</td>\n      <td>100.26%</td>\n    </tr>\n    <tr>\n      <td><b>Average Score</b></td>\n      <td><b>81.62</b></td>\n      <td><b>82.00</b></td>\n      <td><b>100.46%</b></td>\n    </tr>\n    <tr>\n      <td rowspan=\"2\"><b>Text</b></td>\n      <td>MGSM (CoT)</td>\n      <td>75.45</td>\n      <td>74.29</td>\n      <td>98.46%</td>\n    </tr>\n    <tr>\n      <td>MMLU (5-shot)</td>\n      <td>86.16</td>\n      <td>85.65</td>\n      <td>99.41%</td>\n    </tr>\n  </tbody>\n</table>\n\n## Inference Performance\n\n\nThis model achieves up to 1.87x speedup in single-stream deployment and up to 1.9x speedup in multi-stream asynchronous deployment, depending on hardware and use-case scenario.\nThe following performance benchmarks were conducted with [vLLM](https://docs.vllm.ai/en/latest/) version 0.7.2, and [GuideLLM](https://github.com/neuralmagic/guidellm).\n\n<details>\n<summary>Benchmarking Command</summary>\n```\n  guidellm --model neuralmagic/Qwen2.5-VL-72B-Instruct-quantized.w8a8 --target \"http://localhost:8000/v1\" --data-type emulated --data prompt_tokens=<prompt_tokens>,generated_tokens=<generated_tokens>,images=<num_images>,width=<image_width>,height=<image_height> --max seconds 120 --backend aiohttp_server\n```\n\n</details>\n\n### Single-stream performance (measured with vLLM version 0.7.2)\n\n<table border=\"1\" class=\"dataframe\">\n  <thead>\n    <tr>\n      <th></th>\n      <th></th>\n      <th></th>\n      <th></th>\n      <th style=\"text-align: center;\" colspan=\"2\" >Document Visual Question Answering<br>1680W x 2240H<br>64/128</th>\n      <th style=\"text-align: center;\" colspan=\"2\" >Visual Reasoning <br>640W x 480H<br>128/128</th>\n     