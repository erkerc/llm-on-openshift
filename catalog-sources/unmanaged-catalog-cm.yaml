e>\n**Use case profiles: Image Size (WxH) / prompt tokens / generation tokens\n**QPD: Queries per dollar, based on on-demand cost at [Lambda Labs](https://lambdalabs.com/service/gpu-cloud) (observed on 2/18/2025).\n\n### Multi-stream asynchronous performance (measured with vLLM version 0.7.2)\n\n<table border=\"1\" class=\"dataframe\">\n  <thead>\n    <tr>\n      <th></th>\n      <th></th>\n      <th></th>\n      <th style=\"text-align: center;\" colspan=\"2\" >Document Visual Question Answering<br>1680W x 2240H<br>64/128</th>\n      <th style=\"text-align: center;\" colspan=\"2\" >Visual Reasoning <br>640W x 480H<br>128/128</th>\n      <th style=\"text-align: center;\" colspan=\"2\" >Image Captioning<br>480W x 360H<br>0/128</th>\n    </tr>\n    <tr>\n      <th>Hardware</th>\n      <th>Model</th>\n      <th>Average Cost Reduction</th>\n      <th>Maximum throughput (QPS)</th>\n      <th>Queries Per Dollar</th>\n      <th>Maximum throughput (QPS)</th>\n      <th>Queries Per Dollar</th>\n      <th>Maximum throughput (QPS)</th>\n      <th>Queries Per Dollar</th>\n    </tr>\n  </thead>\n  <tbody style=\"text-align: center\">\n    <tr>\n      <th rowspan=\"3\" valign=\"top\">A100x4</th>\n      <td>Qwen/Qwen2.5-VL-72B-Instruct</td>\n      <td></td>\n      <td>0.4</td>\n      <td>180</td>\n      <td>1.1</td>\n      <td>539</td>\n      <td>1.2</td>\n      <td>595</td>\n    </tr>\n    <tr>\n      <td>neuralmagic/Qwen2.5-VL-72B-Instruct-quantized.w8a8</td>\n      <td>1.80</td>\n      <td>0.6</td>\n      <td>289</td>\n      <td>2.0</td>\n      <td>1020</td>\n      <td>2.3</td>\n      <td>1133</td>\n    </tr>\n    <tr>\n      <td>neuralmagic/Qwen2.5-VL-72B-Instruct-quantized.w4a16</td>\n      <td>2.75</td>\n      <td>0.7</td>\n      <td>341</td>\n      <td>3.2</td>\n      <td>1588</td>\n      <td>4.1</td>\n      <td>2037</td>\n    </tr>\n    <tr>\n      <th rowspan=\"3\" valign=\"top\">H100x4</th>\n      <td>Qwen/Qwen2.5-VL-72B-Instruct</td>\n      <td></td>\n      <td>0.5</td>\n      <td>134</td>\n      <td>1.2</td>\n      <td>357</td>\n      <td>1.3</td>\n      <td>379</td>\n    </tr>\n    <tr>\n      <td>neuralmagic/Qwen2.5-VL-72B-Instruct-FP8-Dynamic</td>\n      <td>1.73</td>\n      <td>0.9</td>\n      <td>247</td>\n      <td>2.2</td>\n      <td>621</td>\n      <td>2.4</td>\n      <td>669</td>\n    </tr>\n    <tr>\n      <td>neuralmagic/Qwen2.5-VL-72B-Instruct-quantized.w4a16</td>\n      <td>8.27</td>\n      <td>3.3</td>\n      <td>913</td>\n      <td>3.3</td>\n      <td>898</td>\n      <td>3.6</td>\n      <td>991</td>\n    </tr>\n  </tbody>\n</table>\n**Use case profiles: Image Size (WxH) / prompt tokens / generation tokens\n**QPS: Queries per second.\n\n**QPD: Queries per dollar, based on on-demand cost at [Lambda Labs](https://lambdalabs.com/service/gpu-cloud) (observed on 2/18/2025).    ","logo":"data:image/png;base64,","language":["en"],"license":"apache-2.0","licenseLink":"https://huggingface.co/datasets/choosealicense/licenses/blob/main/markdown/apache-2.0.md","maturity":"Generally Available","libraryName":"transformers","baseModel":[{"repository":"Qwen"},{"name":"Qwen2.5-VL-72B-Instruct"}],"labels":["inference","vllm","vision","w8a8"],"tasks":["image-text-to-text"],"createTimeSinceEpoch":1738886400,"lastUpdateTimeSinceEpoch":1741132800,"artifacts":[{"protocol":"NOT YET IN REGISTRY","createTimeSinceEpoch":null,"tags":null,"uri":"https://huggingface.co/neuralmagic/Qwen2.5-VL-72B-Instruct-quantized.w8a8/commits/main"}]},{"repository":"neuralmagic-ent","name":"Mixtral-8x22B-v0.1-quantized.w4a16","provider":"Neural Magic","description":"Quantized version of Mixtral-8x22B-v0.1. It achieves an average score of 74.17 on the OpenLLM benchmark (version 1), whereas the unquantized model achieves 74.69.","longDescription":"This model was obtained by only quantizing the weights to INT4 data type, ready for inference with \n  vLLM >= 0.5.2. This optimization reduces the number of bits per parameter from 16 to 4, reducing \n  the disk size and GPU memory requirements by approximately 75%. Only the weights of the linear \n  operators within transformers blocks are quantized, except the MLP routers.","readme":"# Mixtral-8x22B-v0.1-quantized.w4a16\n\n## Model Overview\n- **Model Architecture:** Mixtral-8x22B-v0.1\n  - **Input:** Text\n  - **Output:** Text\n- **Model Optimizations:**\n  - **Weight quantization:** INT4\n  - **Activation quantization:** None\n- **Release Date:** 3/1/2025\n- **Version:** 1.0\n- **Model Developers:** Neural Magic\n\nQuantized version of [Mixtral-8x22B-v0.1](https://huggingface.co/mistralai/Mixtral-8x22B-v0.1).\nIt achieves an average score of 74.17 on the [OpenLLM](https://huggingface.co/spaces/open-llm-leaderboard/open_llm_leaderboard) benchmark (version 1), whereas the unquantized model achieves 74.69.\n\n### Model Optimizations\n\nThis model was obtained by only quantizing the weights to INT4 data type, ready for inference with vLLM >= 0.5.2.\nThis optimization reduces the number of bits per parameter from 16 to 4, reducing the disk size and GPU memory requirements by approximately 75%. Only the weights of the linear operators within transformers blocks are quantized, except the MLP routers. \n\n## Deployment\n\n### Use with vLLM\n\nThis model can be deployed efficiently using the [vLLM](https://docs.vllm.ai/en/latest/) backend, as shown in the example below.\n\n```python\nfrom transformers import AutoTokenizer\nfrom vllm import LLM, SamplingParams\nmax_model_len, tp_size = 4096, 4\nmodel_name = \"neuralmagic-ent/Mixtral-8x22B-v0.1-quantized.w4a16\"\ntokenizer = AutoTokenizer.from_pretrained(model_name)\nllm = LLM(model=model_name, tensor_parallel_size=tp_size, max_model_len=max_model_len, trust_remote_code=True)\nsampling_params = SamplingParams(temperature=0.3, max_tokens=256, stop_token_ids=[tokenizer.eos_token_id])\nmessages_list = [\n    [{\"role\": \"user\", \"content\": \"Who are you? Please respond in pirate speak!\"}],\n]\nprompt_token_ids = [tokenizer.apply_chat_template(messages, add_generation_prompt=True) for messages in messages_list]\noutputs = llm.generate(prompt_token_ids=prompt_token_ids, sampling_params=sampling_params)\ngenerated_text = [output.outputs[0].text for output in outputs]\nprint(generated_text)\n```\n\nvLLM also supports OpenAI-compatible serving. See the [documentation](https://docs.vllm.ai/en/latest/) for more details.\n\n## Creation\n\nThis model was created with [llm-compressor](https://github.com/vllm-project/llm-compressor) by running the code snippet below with the following command:\n\n```bash\npython quantize.py --model_path mistralai/Mixtral-8x22B-v0.1 --quant_path \"output_dir\" --calib_size 1024 --dampening_frac 0.1 --observer minmax --actorder False \n```\n\n\n```python\nfrom datasets import load_dataset\nfrom transformers import AutoTokenizer\nfrom llmcompressor.modifiers.quantization import GPTQModifier\nfrom llmcompressor.transformers import SparseAutoModelForCausalLM, oneshot, apply\nimport argparse\nfrom compressed_tensors.quantization import QuantizationScheme, QuantizationArgs, QuantizationType, QuantizationStrategy\nfrom llmcompressor.transformers.compression.helpers import calculate_offload_device_map\nimport torch\ndef parse_actorder(value):\n    # Interpret the input value for --actorder\n    if value.lower() == \"false\":\n        return False\n    elif value.lower() == \"group\":\n        return \"group\"\n    else:\n        raise argparse.ArgumentTypeError(\"Invalid value for --actorder. Use 'group' or 'False'.\")\nparser = argparse.ArgumentParser()\nparser.add_argument('--model_path', type=str)\nparser.add_argument('--quant_path', type=str)\nparser.add_argument('--num_bits', type=int, default=4)\nparser.add_argument('--sequential_update', type=bool, default=True)\nparser.add_argument('--calib_size', type=int, default=256) \nparser.add_argument('--dampening_frac', type=float, default=0.05)\nparser.add_argument('--observer', type=str, default=\"minmax\") \nparser.add_argument(\n    '--actorder',\n    type=parse_actorder,\n    default=False,  # Default value is False\n    help=\"Specify actorder as 'group' (string) or False (boolean).\"\n)\nargs = parser.parse_args()\ndevice_map = calculate_offload_device_map(\n    args.model_path,\n    reserve_for_hessians=True,\n    num_gpus=torch.cuda.device_count(),\n    torch_dtype=torch.bfloat16,\n    trust_remote_code=True,\n)\nmodel = SparseAutoModelForCausalLM.from_pretrained(\n    args.model_path,\n    device_map=device_map,\n    torch_dtype=torch.bfloat16,\n    use_cache=False,\n)\ntokenizer = AutoTokenizer.from_pretrained(args.model_path)\nNUM_CALIBRATION_SAMPLES = args.calib_size\nDATASET_ID = \"garage-bAInd/Open-Platypus\"\nDATASET_SPLIT = \"train\"\nds = load_dataset(DATASET_ID, split=DATASET_SPLIT)\nds = ds.shuffle(seed=42).select(range(NUM_CALIBRATION_SAMPLES))\ndef preprocess(example):\n    concat_txt = example[\"instruction\"] + \"\\n\" + example[\"output\"]\n    return {\"text\": concat_txt}\nds = ds.map(preprocess)\ndef tokenize(sample):\n    return tokenizer(\n        sample[\"text\"],\n        padding=False,\n        truncation=False,\n        add_special_tokens=True,\n    )\nds = ds.map(tokenize, remove_columns=ds.column_names)\nquant_scheme = QuantizationScheme(\n    targets=[\"Linear\"],\n    weights=QuantizationArgs(\n        num_bits=args.num_bits,\n        type=QuantizationType.INT,\n        symmetric=True,\n        group_size=128,\n        strategy=QuantizationStrategy.GROUP,  \n        observer=args.observer,\n        actorder=args.actorder\n    ),\n    input_activations=None,\n    output_activations=None,\n)\nrecipe = [\n    GPTQModifier(\n        targets=[\"Linear\"],\n        ignore=[\"lm_head\", \"re:.*block_sparse_moe.gate\"],\n        sequential_update=args.sequential_update,\n        dampening_frac=args.dampening_frac,\n        config_groups={\"group_0\": quant_scheme},\n    )\n]\noneshot(\n    model=model,\n    dataset=ds,\n    recipe=recipe,\n    num_calibration_samples=args.calib_size,\n)\n# Save to disk compressed.\nSAVE_DIR = args.quant_path\nmodel.save_pretrained(SAVE_DIR, save_compressed=True)\ntokenizer.save_pretrained(SAVE_DIR)\n```\n\n## Evaluation\n\nThe model was evaluated on OpenLLM Leaderboard [V1](https://huggingface.co/spaces/open-llm-leaderboard-old/open_llm_leaderboard) using the following command:\n\nOpenLLM Leaderboard V1:\n```\nlm_eval \\\n  --model vllm \\\n  --model_args pretrained=\"neuralmagic-ent/Mixtral-8x22B-v0.1-quantized.w4a16\",dtype=auto,add_bos_token=True,max_model_len=4096,tensor_parallel_size=4,gpu_memory_utilization=0.8,enable_chunked_prefill=True,trust_remote_code=True \\\n  --tasks openllm \\\n  --write_out \\\n  --batch_size auto \\\n  --output_path output_dir \\\n  --show_config\n```\n\n\n### Accuracy\n\n#### OpenLLM Leaderboard V1 evaluation scores\n\n| Metric                                   | mistralai/Mixtral-8x22B-v0.1             | neuralmagic-ent/Mixtral-8x22B-v0.1-quantized.w4a16 |\n|-----------------------------------------|:---------------------------------:|:-------------------------------------------:|\n| ARC-Challenge (Acc-Norm, 25-shot)       | 70.39                            | 69.88                                       |\n| GSM8K (Strict-Match, 5-shot)            | 76.42                            | 74.68                                        |\n| HellaSwag (Acc-Norm, 10-shot)           | 88.31                            | 87.94                                       |\n| MMLU (Acc, 5-shot)                      | 77.40                            | 76.21                                       |\n| TruthfulQA (MC2, 0-shot)                | 51.17                            | 51.15                                       |\n| Winogrande (Acc, 5-shot)                | 84.45                            | 85.16                                       |\n| **Average Score**                       | **74.69**                        | **74.17**                                   |\n| **Recovery**                            | **100.00**                       | **99.30**                                   |","logo":"data:image/png;base64,","language":["en"],"license":"apache-2.0","licenseLink":"https://huggingface.co/datasets/choosealicense/licenses/blob/main/markdown/apache-2.0.md","maturity":"Generally Available","libraryName":"transformers","baseModel":[{"repository":"mistralai"},{"name":"Mixtral-8x22B-v0.1"}],"labels":["inference"],"tasks":["text-generation"],"createTimeSinceEpoch":1735862400,"lastUpdateTimeSinceEpoch":1735862400,"artifacts":[{"protocol":"NOT YET IN REGISTRY","createTimeSinceEpoch":null,"tags":null,"uri":"https://huggingface.co/neuralmagic-ent/Mixtral-8x22B-v0.1-quantized.w4a16/commits/main"}]},{"repository":"neuralmagic","name":"Pixtral-Large-Instruct-2411-hf-quantized.w8a8","provider":"Neural Magic","description":"Quantized version of neuralmagic/Pixtral-Large-Instruct-2411-hf.","longDescription":"This model was obtained by quantizing the weights of neuralmagic/Pixtral-Large-Instruct-2411-hf to \n  INT8 data type, ready for inference with vLLM >= 0.5.2.","readme":"# Pixtral-Large-Instruct-2411-hf-quantized.w8a8\n\n## Model Overview\n- **Model Architecture:** neuralmagic/Pixtral-Large-Instruct-2411-hf\n  - **Input:** Vision-Text\n  - **Output:** Text\n- **Model Optimizations:**\n  - **Weight quantization:** INT8\n  - **Activation quantization:** INT8\n- **Release Date:** 2/24/2025\n- **Version:** 1.0\n- **Model Developers:** Neural Magic\n\nQuantized version of [neuralmagic/Pixtral-Large-Instruct-2411-hf](https://huggingface.co/neuralmagic/Pixtral-Large-Instruct-2411-hf/tree/main).\n\n### Model Optimizations\n\nThis model was obtained by quantizing the weights of [neuralmagic/Pixtral-Large-Instruct-2411-hf](https://huggingface.co/neuralmagic/Pixtral-Large-Instruct-2411-hf/tree/main) to INT8 data type, ready for inference with vLLM >= 0.5.2.\n\n## Deployment\n\n### Use with vLLM\n\nThis model can be deployed efficiently using the [vLLM](https://docs.vllm.ai/en/latest/) backend, as shown in the example below.\n\n```python\nfrom vllm.assets.image import ImageAsset\nfrom vllm import LLM, SamplingParams\n# prepare model\nllm = LLM(\n    model=\"neuralmagic/Pixtral-Large-Instruct-2411-hf-quantized.w8a8\",\n    trust_remote_code=True,\n    max_model_len=4096,\n    max_num_seqs=2,\n)\n# prepare inputs\nquestion = \"What is the content of this image?\"\ninputs = {\n    \"prompt\": f\"<|user|>\\n<|image_1|>\\n{question}<|end|>\\n<|assistant|>\\n\",\n    \"multi_modal_data\": {\n        \"image\": ImageAsset(\"cherry_blossom\").pil_image.convert(\"RGB\")\n    },\n}\n# generate response\nprint(\"========== SAMPLE GENERATION ==============\")\noutputs = llm.generate(inputs, SamplingParams(temperature=0.2, max_tokens=64))\nprint(f\"PROMPT  : {outputs[0].prompt}\")\nprint(f\"RESPONSE: {outputs[0].outputs[0].text}\")\nprint(\"==========================================\")\n```\n\nvLLM also supports OpenAI-compatible serving. See the [documentation](https://docs.vllm.ai/en/latest/) for more details.\n\n## Creation\n\nThis model was created with [llm-compressor](https://github.com/vllm-project/llm-compressor) by running the code snippet below as part a multimodal announcement blog.\n\n<details>\n  <summary>Model Creation Code</summary>\n  \n```python\nimport requests\nimport torch\nfrom PIL import Image\nfrom transformers import AutoProcessor\nfrom llmcompressor.modifiers.quantization import GPTQModifier\nfrom llmcompressor.transformers import oneshot\nfrom llmcompressor.transformers.tracing import TraceableLlavaForConditionalGeneration\n        \n# Load model.\nmodel_id = \"neuralmagic/Pixtral-Large-Instruct-2411-hf\"\nmodel = TraceableLlavaForConditionalGeneration.from_pretrained(\n    model_id, device_map=\"auto\", torch_dtype=\"auto\"\n)\nprocessor = AutoProcessor.from_pretrained(model_id, trust_remote_code=True)\n# Oneshot arguments\nDATASET_ID = \"flickr30k\"\nDATASET_SPLIT = {\"calibration\": \"test[:512]\"}\nNUM_CALIBRATION_SAMPLES = 512\nMAX_SEQUENCE_LENGTH = 2048\n# Define a oneshot data collator for multimodal inputs.\ndef data_collator(batch):\n    assert len(batch) == 1\n    return {\n        \"input_ids\": torch.LongTensor(batch[0][\"input_ids\"]),\n        \"attention_mask\": torch.tensor(batch[0][\"attention_mask\"]),\n        \"pixel_values\": torch.tensor(batch[0][\"pixel_values\"]),\n    }\n# Recipe\nrecipe = [\n    GPTQModifier(\n        targets=\"Linear\",\n        scheme=\"W8A8\",\n        sequential_targets=[\"MistralDecoderLayer\"],\n        ignore=[\"re:.*lm_head\", \"re:vision_tower.*\", \"re:multi_modal_projector.*\"],\n    ),\n]\nSAVE_DIR==f\"{model_id.split('/')[1]}-quantized.w8a8\"\n# Perform oneshot\noneshot(\n    model=model,\n    tokenizer=model_id,\n    dataset=DATASET_ID,\n    splits=DATASET_SPLIT,\n    recipe=recipe,\n    max_seq_length=MAX_SEQUENCE_LENGTH,\n    num_calibration_samples=NUM_CALIBRATION_SAMPLES,\n    trust_remote_code_model=True,\n    data_collator=data_collator,\n    output_dir=SAVE_DIR\n)\n```\n</details>\n\n## Evaluation\n\nThe model was evaluated using [mistral-evals](https://github.com/neuralmagic/mistral-evals) for vision-related tasks and using [lm_evaluation_harness](https://github.com/neuralmagic/lm-evaluation-harness) for select text-based benchmarks. The evaluations were conducted using the following commands:\n\n<details>\n<summary>Evaluation Commands</summary>\n  \n### Vision Tasks\n- vqav2\n- docvqa\n- mathvista\n- mmmu\n- chartqa\n\n```\nvllm serve neuralmagic/pixtral-12b-quantized.w8a8 --tensor_parallel_size 1 --max_model_len 25000 --trust_remote_code --max_num_seqs 8 --gpu_memory_utilization 0.9 --dtype float16 --limit_mm_per_prompt image=7\npython -m eval.run eval_vllm \\\n        --model_name neuralmagic/pixtral-12b-quantized.w8a8 \\\n        --url http://0.0.0.0:8000 \\\n        --output_dir ~/tmp \\\n        --eval_name <vision_task_name>\n```\n\n### Text-based Tasks\n#### MMLU\n  \n```\nlm_eval \\\n  --model vllm \\\n  --model_args pretrained=\"<model_name>\",dtype=auto,add_bos_token=True,max_model_len=4096,tensor_parallel_size=<n>,gpu_memory_utilization=0.8,enable_chunked_prefill=True,trust_remote_code=True \\\n  --tasks mmlu \\\n  --num_fewshot 5 \\\n  --batch_size auto \\\n  --output_path output_dir\n```\n\n#### MGSM\n\n```\nlm_eval \\\n  --model vllm \\\n  --model_args pretrained=\"<model_name>\",dtype=auto,max_model_len=4096,max_gen_toks=2048,max_num_seqs=128,tensor_parallel_size=<n>,gpu_memory_utilization=0.9 \\\n  --tasks mgsm_cot_native \\\n  --num_fewshot 0 \\\n  --batch_size auto \\\n  --output_path output_dir\n```\n</details>\n\n\n### Accuracy\n\n<table>\n  <thead>\n    <tr>\n      <th>Category</th>\n      <th>Metric</th>\n      <th>neuralmagic/Pixtral-Large-Instruct-2411-hf</th>\n      <th>neuralmagic/Pixtral-Large-Instruct-2411-hf-quantized.w8a8</th>\n      <th>Recovery (%)</th>\n    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td rowspan=\"6\"><b>Vision</b></td>\n      <td>MMMU (val, CoT)<br><i>explicit_prompt_relaxed_correctness</i></td>\n      <td>63.56</td>\n      <td>63.89</td>\n      <td>100.52%</td>\n    </tr>\n    <tr>\n      <td>VQAv2 (val)<br><i>vqa_match</i></td>\n      <td>79.03</td>\n      <td>79.12</td>\n      <td>100.11%</td>\n    </tr>\n    <tr>\n      <td>DocVQA (val)<br><i>anls</i></td>\n      <td>89.55</td>\n      <td>89.80</td>\n      <td>100.28%</td>\n    </tr>\n    <tr>\n      <td>ChartQA (test, CoT)<br><i>anywhere_in_answer_relaxed_correctness</i></td>\n      <td>82.24</td>\n      <td>80.44</td>\n      <td>97.81%</td>\n    </tr>\n    <tr>\n      <td>Mathvista (testmini, CoT)<br><i>explicit_prompt_relaxed_correctness</i></td>\n      <td>67.3</td>\n      <td>66.50</td>\n      <td>98.81%</td>\n    </tr>\n    <tr>\n      <td><b>Average Score</b></td>\n      <td><b>76.34</b></td>\n      <td><b>75.95</b></td>\n      <td><b>99.49%</b></td>\n    </tr>\n    <tr>\n      <td rowspan=\"2\"><b>Text</b></td>\n      <td>MGSM (CoT)</td>\n      <td>76.05</td>\n      <td>74.76</td>\n      <td>98.30%</td>\n    </tr>\n    <tr>\n      <td>MMLU (5-shot)</td>\n      <td>82.8</td>\n      <td>82.9</td>\n      <td>100.12%</td>\n    </tr>\n  </tbody>\n</table>\n\n## Inference Performance\n\n\nThis model achieves up to 1.87x speedup in single-stream deployment and up to 2.0x speedup in multi-stream asynchronous deployment, depending on hardware and use-case scenario.\nThe following performance benchmarks were conducted with [vLLM](https://docs.vllm.ai/en/latest/) version 0.7.2, and [GuideLLM](https://github.com/neuralmagic/guidellm).\n\n<details>\n<summary>Benchmarking Command</summary>\n```\n  guidellm --model neuralmagic/Pixtral-Large-Instruct-2411-hf-quantized.w8a8 --target \"http://localhost:8000/v1\" --data-type emulated --data prompt_tokens=<prompt_tokens>,generated_tokens=<generated_tokens>,images=<num_images>,width=<image_width>,height=<image_height> --max seconds 120 --backend aiohttp_server\n```\n\n</details>\n\n### Single-stream performance (measured with vLLM version 0.7.2)\n\n<table border=\"1\" class=\"dataframe\">\n  <thead>\n    <tr>\n      <th></th>\n      <th></th>\n      <th></th>\n      <th></th>\n      <th style=\"text-align: center;\" colspan=\"2\" >Document Visual Question Answering<br>1680W x 2240H<br>64/128</th>\n      <th style=\"text-align: center;\" colspan=\"2\" >Visual Reasoning <br>640W x 480H<br>128/128</th>\n      <th style=\"text-align: center;\" colspan=\"2\" >Image Captioning<br>480W x 360H<br>0/128</th>\n    </tr>\n    <tr>\n      <th>Hardware</th>\n      <th>Number of GPUs</th>\n      <th>Model</th>\n      <th>Average Cost Reduction</th>\n      <th>Latency (s)</th>\n      <th>Queries Per Dollar</th>\n      <th>Latency (s)</th>\n      <th>Queries Per Dollar</th>\n      <th>Latency (s)</th>\n      <th>Queries Per Dollar</th>\n    </tr>\n  </thead>\n  <tbody style=\"text-align: center\">\n    <tr>\n      <th rowspan=\"3\" valign=\"top\">A100</th>\n      <td>4</td>\n      <td>neuralmagic/Pixtral-Large-Instruct-2411-hf</td>\n      <td></td>\n      <td>7.5</td>\n      <td>67</td>\n      <td>6.5</td>\n      <td>77</td>\n      <td>6.4</td>\n      <td>79</td>\n    </tr>\n    <tr>\n      <td>2</td>\n      <td>neuralmagic/Pixtral-Large-Instruct-2411-hf-quantized.w8a8</td>\n      <td>1.86</td>\n      <td>8.1</td>\n      <td>124</td>\n      <td>7.1</td>\n      <td>142</td>\n      <td>6.8</td>\n      <td>148</td>\n    </tr>\n    <tr>\n      <td>2</td>\n      <td>neuralmagic/Pixtral-Large-Instruct-2411-hf-quantized.w4a16</td>\n      <td>2.52</td>\n      <td>6.9</td>\n      <td>147</td>\n      <td>5.1</td>\n      <td>199</td>\n      <td>4.5</td>\n      <td>221</td>\n    </tr>\n    <tr>\n      <th rowspan=\"3\" valign=\"top\">H100</th>\n      <td>4</td>\n      <td>neuralmagic/Pixtral-Large-Instruct-2411-hf</td>\n      <td></td>\n      <td>4.4</td>\n      <td>67</td>\n      <td>3.9</td>\n      <td>74</td>\n      <td>3.7</td>\n      <td>79</td>\n    </tr>\n    <tr>\n      <td>2</td>\n      <td>neuralmagic/Pixtral-Large-Instruct-2411-hf-FP8-Dynamic</td>\n      <td>1.82</td>\n      <td>4.7</td>\n      <td>120</td>\n      <td>4.1</td>\n      <td>137</td>\n      <td>3.9</td>\n      <td>145</td>\n    </tr>\n    <tr>\n      <td>2</td>\n      <td>neuralmagic/Pixtral-Large-Instruct-2411-hf-quantized.w4a16</td>\n      <td>1.87</td>\n      <td>4.7</td>\n      <td>120</td>\n      <td>3.9</td>\n      <td>144</td>\n      <td>3.8</td>\n      <td>149</td>\n    </tr>\n  </tbody>\n</table>\n\n**Use case profiles: Image Size (WxH) / prompt tokens / generation tokens\n**QPD: Queries per dollar, based on on-demand cost at [Lambda Labs](https://lambdalabs.com/service/gpu-cloud) (observed on 2/18/2025).\n### Multi-stream asynchronous performance (measured with vLLM version 0.7.2)\n<table border=\"1\" class=\"dataframe\">\n  <thead>\n    <tr>\n      <th></th>\n      <th></th>\n      <th></th>\n      <th style=\"text-align: center;\" colspan=\"2\" >Document Visual Question Answering<br>1680W x 2240H<br>64/128</th>\n      <th style=\"text-align: center;\" colspan=\"2\" >Visual Reasoning <br>640W x 480H<br>128/128</th>\n      <th style=\"text-align: center;\" colspan=\"2\" >Image Captioning<br>480W x 360H<br>0/128</th>\n    </tr>\n    <tr>\n      <th>Hardware</th>\n      <th>Model</th>\n      <th>Average Cost Reduction</th>\n      <th>Maximum throughput (QPS)</th>\n      <th>Queries Per Dollar</th>\n      <th>Maximum throughput (QPS)</th>\n      <th>Queries Per Dollar</th>\n      <th>Maximum throughput (QPS)</th>\n      <th>Queries Per Dollar</th>\n    </tr>\n  </thead>\n  <tbody style=\"text-align: center\">\n  <tr>\n      <th rowspan=\"3\" valign=\"top\">A100x4</th>\n      <td>neuralmagic/Pixtral-Large-Instruct-2411-hf</td>\n      <td></td>\n      <td>0.4</td>\n      <td>222</td>\n      <td>0.7</td>\n      <td>341</td>\n      <td>0.8</td>\n      <td>399</td>\n    </tr>\n    <tr>\n      <td>neuralmagic/Pixtral-Large-Instruct-2411-hf-quantized.w8a8</td>\n      <td>1.70</td>\n      <td>0.8</td>\n      <td>383</td>\n      <td>1.1</td>\n      <td>571</td>\n      <td>1.3</td>\n      <td>674</td>\n    </tr>\n    <tr>\n      <td>neuralmagic/Pixtral-Large-Instruct-2411-hf-quantized.w4a16</td>\n      <td>1.48</td>\n      <td>0.5</td>\n      <td>276</td>\n      <td>1.0</td>\n      <td>505</td>\n      <td>1.4</td>\n      <td>680</td>\n    </tr>\n    <tr>\n      <<th rowspan=\"3\" valign=\"top\">H100x4</th>\n      <td>neuralmagic/Pixtral-Large-Instruct-2411-hf</td>\n      <td></td>\n      <td>1.0</td>\n      <td>284</td>\n      <td>1.6</td>\n      <td>465</td>\n      <td>1.8</td>\n      <td>511</td>\n    </tr>\n    <tr>\n      <td>neuralmagic/Pixtral-Large-Instruct-2411-hf-FP8-Dynamic</td>\n      <td>1.61</td>\n      <td>1.7</td>\n      <td>467</td>\n      <td>2.6</td>\n      <td>726</td>\n      <td>3.2</td>\n      <td>908</td>\n    </tr>\n    <tr>\n      <td>neuralmagic/Pixtral-Large-Instruct-2411-hf-quantized.w4a16</td>\n      <td>1.33</td>\n      <td>1.4</td>\n      <td>393</td>\n      <td>2.2</td>\n      <td>726</td>\n      <td>2.7</td>\n      <td>764</td>\n    </tr>\n  </tbody>\n</table>\n**Use case profiles: Image Size (WxH) / prompt tokens / generation tokens\n\n**QPS: Queries per second.\n**QPD: Queries per dollar, based on on-demand cost at [Lambda Labs](https://lambdalabs.com/service/gpu-cloud) (observed on 2/18/2025).\n\n## The Mistral AI Team\n\nAlbert Jiang, Alexandre Sablayrolles, Alexis Tacnet, Alok Kothari, Antoine Roux, Arthur Mensch, Audrey Herblin-Stoop, Augustin Garreau, Austin Birky, Bam4d, Baptiste Bout, Baudouin de Monicault, Blanche Savary, Carole Rambaud, Caroline Feldman, Devendra Singh Chaplot, Diego de las Casas, Diogo Costa, Eleonore Arcelin, Emma Bou Hanna, Etienne Metzger, Gaspard Blanchet, Gianna Lengyel, Guillaume Bour, Guillaume Lample, Harizo Rajaona, Henri Roussez, Hichem Sattouf, Ian Mack, Jean-Malo Delignon, Jessica Chudnovsky, Justus Murke, Kartik Khandelwal, Lawrence Stewart, Louis Martin, Louis Ternon, Lucile Saulnier, Lélio Renard Lavaud, Margaret Jennings, Marie Pellat, Marie Torelli, Marie-Anne Lachaux, Marjorie Janiewicz, Mickaël Seznec, Nicolas Schuhl, Niklas Muhs, Olivier de Garrigues, Patrick von Platen, Paul Jacob, Pauline Buche, Pavan Kumar Reddy, Perry Savas, Pierre Stock, Romain Sauvestre, Sagar Vaze, Sandeep Subramanian, Saurabh Garg, Sophia Yang, Szymon Antoniak, Teven Le Scao, Thibault Schueller, Thibaut Lavril, Thomas Wang, Théophile Gervet, Timothée Lacroix, Valera Nemychnikova, Wendy Shang, William El Sayed, William Marshall","logo":"data:image/png;base64,","language":["en","fr","de","es","it","pt","zh","ja","ru","ko"],"license":"mrl","licenseLink":"https://mistral.ai/licenses/MRL-0.1.md","maturity":"Generally Available","libraryName":"transformers","baseModel":[{"repository":"neuralmagic"},{"name":"Pixtral-Large-Instruct-2411-hf"}],"labels":["inference","w8a8","int8","vllm","vision"],"tasks":["image-text-to-text"],"createTimeSinceEpoch":1738886400,"lastUpdateTimeSinceEpoch":1741046400,"artifacts":[{"protocol":"NOT YET IN REGISTRY","createTimeSinceEpoch":null,"tags":null,"uri":"https://huggingface.co/neuralmagic/Pixtral-Large-Instruct-2411-hf-quantized.w8a8"}]},{"repository":"neuralmagic","name":"whisper-large-v2-W4A16-G128","provider":"Neural Magic","description":"Quantized version of openai/whisper-large-v2.","longDescription":"This model was obtained by quantizing the weights of openai/whisper-large-v2 to INT4 data type, \n  ready for inference with vLLM >= 0.5.2.","readme":"# whisper-large-v2-quantized.w4a16\n\n## Model Overview\n- **Model Architecture:** whisper-large-v2\n  - **Input:** Audio-Text\n  - **Output:** Text\n- **Model Optimizations:**\n  - **Weight quantization:** INT4\n  - **Activation quantization:** FP16\n- **Release Date:** 1/31/2025\n- **Version:** 1.0\n- **Model Developers:** Neural Magic\n\nQuantized version of [openai/whisper-large-v2](https://huggingface.co/openai/whisper-large-v2).\n\n### Model Optimizations\n\nThis model was obtained by quantizing the weights of [openai/whisper-large-v2](https://huggingface.co/openai/whisper-large-v2) to INT4 data type, ready for inference with vLLM >= 0.5.2.\n\n## Deployment\n\n### Use with vLLM\n\nThis model can be deployed efficiently using the [vLLM](https://docs.vllm.ai/en/latest/) backend, as shown in the example below.\n\n```python\nfrom vllm.assets.audio import AudioAsset\nfrom vllm import LLM, SamplingParams\n# prepare model\nllm = LLM(\n    model=\"neuralmagic/whisper-large-v2-W4A16-G128\",\n    max_model_len=448,\n    max_num_seqs=400,\n    limit_mm_per_prompt={\"audio\": 1},\n)\n# prepare inputs\ninputs = {  # Test explicit encoder/decoder prompt\n    \"encoder_prompt\": {\n        \"prompt\": \"\",\n        \"multi_modal_data\": {\n            \"audio\": AudioAsset(\"winning_call\").audio_and_sample_rate,\n        },\n    },\n    \"decoder_prompt\": \"<|startoftranscript|>\",\n}\n# generate response\nprint(\"========== SAMPLE GENERATION ==============\")\noutputs = llm.generate(inputs, SamplingParams(temperature=0.0, max_tokens=64))\nprint(f\"PROMPT  : {outputs[0].prompt}\")\nprint(f\"RESPONSE: {outputs[0].outputs[0].text}\")\nprint(\"==========================================\")\n```\n\nvLLM also supports OpenAI-compatible serving. See the [documentation](https://docs.vllm.ai/en/latest/) for more details.\n\n## Creation\n\nThis model was created with [llm-compressor](https://github.com/vllm-project/llm-compressor) by running the code snippet below as part a multimodal announcement blog.\n\n```python\nimport torch\nfrom datasets import load_dataset\nfrom transformers import WhisperProcessor\nfrom llmcompressor.modifiers.quantization import GPTQModifier\nfrom llmcompressor.transformers import oneshot\nfrom llmcompressor.transformers.tracing import TraceableWhisperForConditionalGeneration\n# Select model and load it.\nmodel_id = \"openai/whisper-large-v2\"\nmodel = TraceableWhisperForConditionalGeneration.from_pretrained(\n    model_id,\n    device_map=\"auto\",\n    torch_dtype=\"auto\",\n)\nprocessor = WhisperProcessor.from_pretrained(model_id)\n# Configure processor the dataset task.\nprocessor.tokenizer.set_prefix_tokens(language=\"en\", task=\"transcribe\")\n# Select calibration dataset.\nDATASET_ID = \"MLCommons/peoples_speech\"\nDATASET_SUBSET = \"test\"\nDATASET_SPLIT = \"test\"\n# Select number of samples. 512 samples is a good place to start.\n# Increasing the number of samples can improve accuracy.\nNUM_CALIBRATION_SAMPLES = 512\nMAX_SEQUENCE_LENGTH = 2048\n# Load dataset and preprocess.\nds = load_dataset(\n    DATASET_ID,\n    DATASET_SUBSET,\n    split=f\"{DATASET_SPLIT}[:{NUM_CALIBRATION_SAMPLES}]\",\n    trust_remote_code=True,\n)\n# Preprocess and Tokenize inputs.\ndef preprocess_and_tokenize(example):\n    audio = example[\"audio\"][\"array\"]\n    sampling_rate = example[\"audio\"][\"sampling_rate\"]\n    text = \" \" + example[\"text\"].capitalize()\n    audio_inputs = processor(\n        audio=audio,\n        sampling_rate=sampling_rate,\n        return_tensors=\"pt\",\n    )\n    text_inputs = processor(\n        text=text,\n        add_special_tokens=True,\n        return_tensors=\"pt\"\n    )\n    text_inputs[\"decoder_input_ids\"] = text_inputs[\"input_ids\"]\n    del text_inputs[\"input_ids\"]\n    return dict(**audio_inputs, **text_inputs)\nds = ds.map(preprocess_and_tokenize, remove_columns=ds.column_names)\n# Define a oneshot data collator for multimodal inputs.\ndef data_collator(batch):\n    assert len(batch) == 1\n    return {key: torch.tensor(value) for key, value in batch[0].items()}\n# Recipe\nrecipe = GPTQModifier(targets=\"Linear\", scheme=\"W4A16\", ignore=[\"lm_head\"])\n# Apply algorithms.\nSAVE_DIR = model_id.split(\"/\")[1] + \"-W4A16-G128\"\noneshot(\n    model=model,\n    dataset=ds,\n    recipe=recipe,\n    max_seq_length=MAX_SEQUENCE_LENGTH,\n    num_calibration_samples=NUM_CALIBRATION_SAMPLES,\n    data_collator=data_collator,\n    output_dir=SAVE_DIR,\n)\n```\n\n\n### BibTeX entry and citation info\n```bibtex\n@misc{radford2022whisper,\n  doi = {10.48550/ARXIV.2212.04356},\n  url = {https://arxiv.org/abs/2212.04356},\n  author = {Radford, Alec and Kim, Jong Wook and Xu, Tao and Brockman, Greg and McLeavey, Christine and Sutskever, Ilya},\n  title = {Robust Speech Recognition via Large-Scale Weak Supervision},\n  publisher = {arXiv},\n  year = {2022},\n  copyright = {arXiv.org perpetual, non-exclusive license}\n}   ","logo":"data:image/png;base64,","language":["en"],"license":"apache-2.0","licenseLink":"https://huggingface.co/datasets/choosealicense/licenses/blob/main/markdown/apache-2.0.md","maturity":"Generally Available","libraryName":"transformers","baseModel":[{"repository":"openai"},{"name":"whisper-large-v2"}],"labels":["inference","w4a16","int4","vllm","audio"],"tasks":["automatic-speech-recognition"],"createTimeSinceEpoch":1738281600,"lastUpdateTimeSinceEpoch":1738281600,"artifacts":[{"protocol":"NOT YET IN REGISTRY","createTimeSinceEpoch":null,"tags":null,"uri":"https://huggingface.co/neuralmagic/whisper-large-v2-W4A16-G128"}]}]}]}